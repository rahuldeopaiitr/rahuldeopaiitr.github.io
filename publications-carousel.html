<!--
  3D CYLINDRICAL PUBLICATION CAROUSEL  —  Rahul Deopa
  ============================================================================
  Self-contained & transparent. Everything is scoped with the "cf-" prefix so
  it won't clash with your site's CSS.

  TO EMBED IN YOUR SITE: copy the three blocks below into your publications
  section — (1) the <div class="cf-wrap"> … </div>, (2) the <style> block,
  (3) the <script> block. No libraries, no build step.

  DATA: the four real publications (cover image, title, journal, year, DOI)
  live in the PUBS array at the top of the <script>. Edit only there to add or
  reorder papers. Covers load from your GitHub assets by absolute URL, so they
  render immediately and keep working after deploy.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Publications carousel — preview</title>
<style>
  /* ---- preview page only (NOT part of the component) ---- */
  body{ margin:0; min-height:100vh; display:grid; place-items:center;
        background:#0C3040; /* stand-in so you can see the transparent carousel; remove when embedding */
        font-family:system-ui,sans-serif; }
</style>

<!-- ================= (2) COMPONENT STYLES ================= -->
<style>
  .cf-wrap{
    /* accents pulled from your site theme */
    --cf-accent:#35A9C0;
    --cf-accent-deep:#12718A;
    --cf-card-w:clamp(150px, 40vw, 240px);
    position:relative;
    width:100%;
    padding:1rem 0 0.5rem;
    display:flex; flex-direction:column; align-items:center;
    background:transparent;               /* transparent — blends with the page */
    user-select:none; -webkit-user-select:none;
  }
  .cf{
    position:relative;
    width:100%;
    height:clamp(280px, 58vw, 420px);
    perspective:1200px;
    outline:none;
  }
  .cf-stage{
    position:absolute; inset:0;
    transform-style:preserve-3d;
    touch-action:pan-y;                    /* vertical page scroll still works */
    cursor:grab;
  }
  .cf-stage.dragging{ cursor:grabbing; }
  .cf-card{
    position:absolute; left:50%; top:50%;
    width:var(--cf-card-w);
    will-change:transform, opacity;
    transition:transform .55s cubic-bezier(.22,.61,.36,1), opacity .55s ease;
    transform-style:preserve-3d;
  }
  .cf-card a{
    display:block; outline:none; -webkit-tap-highlight-color:transparent;
    border-radius:6px;
    transition:transform .3s ease, filter .3s ease;
  }
  .cf-card img{
    display:block; width:100%; height:auto; border-radius:6px;
    /* soft shadow only — NO frame, panel, base, or background */
    filter:drop-shadow(0 18px 34px rgba(0,0,0,.45));
    pointer-events:none;                   /* so drags don't get eaten by the image */
  }
  /* hover / focus cue that the cover is clickable: slight raise + glow */
  .cf-card.is-front a:hover,
  .cf-card a:focus-visible{
    transform:translateY(-6px) scale(1.04);
    filter:drop-shadow(0 0 14px rgba(53,169,192,.65)) drop-shadow(0 22px 40px rgba(0,0,0,.5));
  }
  .cf-card a:focus-visible{ outline:2.5px solid var(--cf-accent); outline-offset:6px; }

  /* arrows */
  .cf-controls{ display:flex; gap:1.4rem; margin-top:0.6rem; }
  .cf-btn{
    width:48px; height:48px; border-radius:50%;
    border:1px solid rgba(255,255,255,.28);
    background:rgba(255,255,255,.08); color:#fff;
    display:grid; place-items:center; cursor:pointer;
    backdrop-filter:blur(4px);
    transition:background .18s ease, border-color .18s ease, transform .18s ease;
  }
  .cf-btn:hover{ background:var(--cf-accent-deep); border-color:var(--cf-accent); }
  .cf-btn:active{ transform:scale(.92); }
  .cf-btn:focus-visible{ outline:2.5px solid var(--cf-accent); outline-offset:3px; }
  .cf-btn svg{ width:22px; height:22px; }

  .cf-sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  @media (prefers-reduced-motion:reduce){
    .cf-card, .cf-card a{ transition:none; }
  }
</style>
</head>
<body>

<!-- ================= (1) COMPONENT MARKUP ================= -->
<div class="cf-wrap">
  <div class="cf" id="cf"
       role="group" aria-roledescription="carousel"
       aria-label="Research publications — rotate to browse">
    <div class="cf-stage" id="cfStage"><!-- cards injected by script --></div>
  </div>

  <div class="cf-controls">
    <button class="cf-btn" id="cfPrev" aria-label="Rotate to previous publication">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <button class="cf-btn" id="cfNext" aria-label="Rotate to next publication">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </div>

  <div class="cf-sr" aria-live="polite" id="cfLive"></div>
</div>

<!-- ================= (3) COMPONENT SCRIPT ================= -->
<script>
(function(){
  // -------- REAL PUBLICATION DATA (edit only here) --------
  const PUBS = [
    { cover:"https://rahuldeopaiitr.github.io/assets/cover_jhy.jpg",
      title:"Integrated hydrodynamic–water-quality modelling and QMRA of flood-borne human-health risk during the 2023 Delhi flood",
      journal:"Journal of Hydrology", year:"2026",
      doi:"https://doi.org/10.1016/j.jhydrol.2026.135999" },
    { cover:"https://rahuldeopaiitr.github.io/assets/cover_nh.jpg",
      title:"Cascading impacts of 2025 June–July multi-hazard episodes in the Western Himalayas",
      journal:"Natural Hazards", year:"2025",
      doi:"https://doi.org/10.1007/s11069-025-07699-x" },
    { cover:"https://rahuldeopaiitr.github.io/assets/cover_wrx.jpg",
      title:"HyEco: a hybrid hydrodynamic-cum-ecological modelling framework for flood and human-health risks",
      journal:"Water Research X", year:"2025",
      doi:"https://doi.org/10.1016/j.wroa.2025.100396" },
    { cover:"https://rahuldeopaiitr.github.io/assets/cover_stoten.jpg",
      title:"Urbanization–climate change–flood risk nexus in densely populated urban megacities",
      journal:"Science of the Total Environment", year:"2024",
      doi:"https://doi.org/10.1016/j.scitotenv.2024.175882" }
  ];

  const stage = document.getElementById('cfStage');
  const cf    = document.getElementById('cf');
  const live  = document.getElementById('cfLive');
  const n = PUBS.length;
  let active = 0;

  // build cards
  const cards = PUBS.map((p, i) => {
    const card = document.createElement('div');
    card.className = 'cf-card';
    const a = document.createElement('a');
    a.href = p.doi;
    a.target = '_blank';
    a.rel = 'noopener';
    a.setAttribute('aria-label',
      'Open “' + p.title + '” — ' + p.journal + ' (' + p.year + '). Opens the DOI in a new tab.');
    const img = document.createElement('img');
    img.src = p.cover;
    img.alt = p.journal + ' (' + p.year + ') — ' + p.title;
    img.loading = 'lazy';
    a.appendChild(img);
    card.appendChild(a);
    stage.appendChild(card);
    return card;
  });

  // layout constants derived from card width (recomputed on resize)
  let GAP, DEPTH;
  const ROT = 48, SCALE_STEP = 0.16, MAX_VISIBLE = 3;
  function measure(){
    const w = cards[0].getBoundingClientRect().width || 200;
    GAP = w * 0.72;
    DEPTH = w * 0.95;
  }

  function offsetOf(i){
    let o = i - active;
    if (o >  n/2) o -= n;
    if (o < -n/2) o += n;
    return o;
  }

  function render(){
    cards.forEach((card, i) => {
      const o = offsetOf(i);
      const ao = Math.abs(o);
      const hidden = ao > MAX_VISIBLE;
      const scale = Math.max(0.4, 1 - ao * SCALE_STEP);
      const opacity = hidden ? 0 : Math.max(0, 1 - ao * 0.34);
      card.style.transform =
        'translate(-50%,-50%)' +
        ' translateX(' + (o * GAP) + 'px)' +
        ' translateZ(' + (-ao * DEPTH) + 'px)' +
        ' rotateY(' + (-o * ROT) + 'deg)' +
        ' scale(' + scale + ')';
      card.style.opacity = opacity;
      card.style.zIndex = String(100 - ao);
      card.style.pointerEvents = hidden ? 'none' : 'auto';
      card.classList.toggle('is-front', o === 0);
      card.querySelector('a').tabIndex = hidden ? -1 : 0;
    });
    const p = PUBS[active];
    live.textContent = p.journal + ' (' + p.year + '): ' + p.title;
  }

  function setActive(k){ active = ((k % n) + n) % n; render(); }

  // arrows
  document.getElementById('cfPrev').addEventListener('click', () => setActive(active - 1));
  document.getElementById('cfNext').addEventListener('click', () => setActive(active + 1));

  // keyboard on the carousel region
  cf.tabIndex = 0;
  cf.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft'){ e.preventDefault(); setActive(active - 1); }
    else if (e.key === 'ArrowRight'){ e.preventDefault(); setActive(active + 1); }
  });

  // drag / swipe (pointer events cover mouse + touch)
  let dragging = false, lastX = 0, accum = 0, moved = 0, stepPx = 70;
  stage.addEventListener('pointerdown', (e) => {
    dragging = true; lastX = e.clientX; accum = 0; moved = 0;
    stepPx = Math.max(48, (cards[0].getBoundingClientRect().width || 200) * 0.5);
    stage.classList.add('dragging');
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - lastX; lastX = e.clientX;
    accum += dx; moved += Math.abs(dx);
    while (accum >  stepPx){ setActive(active - 1); accum -= stepPx; }  // drag right → previous
    while (accum < -stepPx){ setActive(active + 1); accum += stepPx; }
  });
  const endDrag = (e) => { if (!dragging) return; dragging = false; stage.classList.remove('dragging');
    try { stage.releasePointerCapture(e.pointerId); } catch(_){} };
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);

  // suppress the DOI navigation if the pointer was dragged (so a swipe never opens a link)
  cards.forEach((card) => {
    card.querySelector('a').addEventListener('click', (e) => {
      if (moved > 10) { e.preventDefault(); }
    });
  });

  window.addEventListener('resize', () => { measure(); render(); });

  // init (measure after images have a box)
  measure(); render();
  window.addEventListener('load', () => { measure(); render(); });
})();
</script>
</body>
</html>
